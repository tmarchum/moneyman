name: Keep Alive

# Prevents GitHub from auto-disabling scheduled workflows (e.g. the nightly
# "Scrape") after 60 days of repository inactivity. Runs a few times a month and
# only makes a tiny empty commit when the repo has been idle for over 20 days,
# which resets the 60-day inactivity timer for all scheduled workflows.

on:
  schedule:
    - cron: "0 6 1,11,21 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Empty commit if the repo has been idle over 20 days
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Days since last commit: $days"
          if [ "$days" -ge 20 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive — keep scheduled workflows enabled [skip ci]"
            git push
            echo "Pushed keepalive commit."
          else
            echo "Repo recently active; no keepalive commit needed."
          fi
